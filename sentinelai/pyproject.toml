[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "0.1.0"
description = "Human-in-the-loop security event triage agent."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pydantic>=2.10",
    "streamlit>=1.40",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
